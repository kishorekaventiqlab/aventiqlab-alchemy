purpose: >
  Builds the KNOW/UNDERSTAND foundation on why CPU-based HPA is a poor fit for GPU-bound
  inference and what KEDA scalers are available instead, as pure reference facts - no
  scenario narrative (Video) or hands-on build (Lab).
content_summary: >
  A reference document comparing CPU-based HPA against KEDA custom-metric scaling for
  GPU workloads, and explaining why queue depth is usually a better demand signal than
  CPU utilization for a GPU-bound service.
