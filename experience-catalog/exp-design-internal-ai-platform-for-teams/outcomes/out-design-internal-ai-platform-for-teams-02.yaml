id: out-design-internal-ai-platform-for-teams-02
experience_ref: exp-design-internal-ai-platform-for-teams
learner_summary: >
  Pilot the platform with one real team voluntarily before proposing a company-wide rollout.
learner_profile_refs:
  - lp-staff-principal-principal-ai-infrastructure-architect
action:
  verb: PROVE
  statement: >
    Pilot the platform with one real team and produce evidence of its value before
    proposing a company-wide rollout.
context: >
  Given a designed platform validated against team input,
